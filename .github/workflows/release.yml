name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the arm64 build stage run on the amd64 runner
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            -o dist .

      - name: Package
        run: |
          mkdir release
          for dir in dist/linux_*; do
            platform="${dir#dist/}" # e.g. linux_amd64
            tar -C "$dir" -czf "release/sunet-xdpd_${GITHUB_REF_NAME}_${platform}.tar.gz" sunet-xdpd
          done
          cd release && sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --generate-notes
